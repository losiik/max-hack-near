          title: Status
      type: object
      required:
      - assist_session_id
      - participant_id
      - status
      title: AcceptOut
    ActionView:
      properties:
        label:
          type: string
          title: Label
        available:
          type: boolean
          title: Available
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - label
      - available
      title: ActionView
    ActiveAssistOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          title: Status
        my_role:
          type: string
          title: My Role
        my_status:
          type: string
          title: My Status
        service_title:
          type: string
          title: Service Title
        owner_display_name:
          type: string
          title: Owner Display Name
        current_step:
          $ref: '#/components/schemas/ShortStepOut'
        total_steps:
          type: integer
          title: Total Steps
      type: object
      required:
      - id
      - status
      - my_role
      - my_status
      - service_title
      - owner_display_name
      - current_step
      - total_steps
      title: ActiveAssistOut
    AnnotationAuthorOut:
      properties:
        participant_id:
          type: string
          format: uuid
          title: Participant Id
        role:
          type: string
          title: Role
        display_name:
          type: string
          title: Display Name
      type: object
      required:
      - participant_id
      - role
      - display_name
      title: AnnotationAuthorOut
    AnnotationOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          type: string
          title: Kind
        element_id:
          type: string
          title: Element Id
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        author:
          $ref: '#/components/schemas/AnnotationAuthorOut'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      type: object
      required:
      - id
      - kind
      - element_id
      - label
      - author
      - expires_at
      title: AnnotationOut
    AssistSessionOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status:
          type: string
          title: Status
        service:
          $ref: '#/components/schemas/max_assist__modules__assist__schemas__ServiceRefOut'
