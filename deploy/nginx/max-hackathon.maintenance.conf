# Isolated production virtual host before frontend and API are deployed.
# Replace only the HTTPS location / after deployment; do not alter other sites.
server {
    listen 80;
    listen [::]:80;
    server_name max-hackathon.explainlaw.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name max-hackathon.explainlaw.ru;

    ssl_certificate /etc/letsencrypt/live/max-hackathon.explainlaw.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max-hackathon.explainlaw.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 503;
    }
}
