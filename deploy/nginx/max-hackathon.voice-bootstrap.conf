# Temporary HTTP-only voice vhost for the first ACME challenge.
# Append this server to the existing max-hackathon vhost, test and reload;
# replace the complete file with max-hackathon.production.conf after certbot.
server {
    listen 80;
    listen [::]:80;
    server_name voice.max-hackathon.explainlaw.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
