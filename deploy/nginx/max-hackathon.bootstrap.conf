# Temporary isolated virtual host used only before the application is deployed.
# It owns a single hostname and never changes the default Nginx site.
server {
    listen 80;
    listen [::]:80;
    server_name max-hackathon.explainlaw.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
