# Render this template on the VM with scripts/render-livekit-production.sh.
# Do not commit the rendered file: it contains the production LiveKit secret.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
room:
  empty_timeout: 300
redis:
  address: redis:6379
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - http://api:8000/api/v1/livekit/webhook
logging:
  level: info
