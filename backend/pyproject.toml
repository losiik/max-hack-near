[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["max_assist", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
timeout = 30
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::sqlalchemy.exc.SAWarning",
]
