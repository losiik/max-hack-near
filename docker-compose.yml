x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=6
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
      - -c
      - temp_file_limit=256MB
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.05
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assist}
      POSTGRES_DB: ${POSTGRES_DB:-assist}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assist"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://assist:assist@postgres:5432/assist}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-minimum}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-t562_hakaton_max_bot}
      REVIEW_LOGIN: ${REVIEW_LOGIN:-review}
      REVIEW_PASSWORD: ${REVIEW_PASSWORD:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-livekit-secret-change-me-32-bytes}
      RECORDINGS_DIR: /recordings
    volumes:
      - ${RECORDINGS_VOLUME:-./recordings}:/recordings
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    stop_grace_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-livekit-secret-change-me-32-bytes}"
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./livekit/livekit.yaml}:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_BIND_ADDRESS:-127.0.0.1}:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    stop_grace_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # цифровой сотрудник: сам приходит в комнату, когда backend его вызывает
  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-dev-livekit-secret-change-me-32-bytes}
      BACKEND_URL: http://api:8000
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen3-235b-a22b-fp8/latest}
      AI_VOICE: ${AI_VOICE:-dasha}
    depends_on:
      - livekit
      - api
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # Egress работает не от root (uid 1001, группа root), а Docker создаёт ./recordings владельцем root
  # с правами 755. Без этого шага на Linux запись идёт, но готовый файл не сохраняется
  recordings-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown 1001:0 /out && chmod 0770 /out"]
    volumes:
      - ./recordings:/out
    restart: "no"
    logging: *logging

  # записывает разговор в ./recordings, внутри запускает браузер без окна
  egress:
    image: livekit/egress:v1.14.1
    restart: unless-stopped
    user: "${EGRESS_USER:-1001:0}"
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ${LIVEKIT_EGRESS_CONFIG_FILE:-./livekit/egress.yaml}:/etc/egress.yaml:ro
      - ${RECORDINGS_VOLUME:-./recordings}:/out
    depends_on:
      recordings-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      livekit:
        condition: service_started
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # Локальная production-сборка frontend. В production этот профиль не запускается:
  # статика собирается локально и публикуется VM Nginx.
  frontend:
    profiles: ["local"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        # локальный стенд открывают в обычном браузере, без MAX: нужен вход тестовыми пользователями
        VITE_BUILD_MODE: ${FRONTEND_BUILD_MODE:-development}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_started
    logging: *logging

  # Локальная точка входа: frontend, API и Assist WebSocket идут через один origin.
  # LiveKit signaling оставлен на localhost:7880, а media-порты 7881/7882
  # проброшены самим сервисом livekit для WebRTC.
  nginx:
    profiles: ["local"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_started
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  # Frontend собирается командой `cd frontend && npm run build`.
  # В production каталог dist публикуется Nginx с VM.

volumes:
  pgdata:
  local_recordings:
